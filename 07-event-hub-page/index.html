<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Event Hub</title>
</head>

<body>

    <header>

        <h1>Event Hub</h1>

        <nav>
            <ul>
                <li><a href="#upcoming-events">Upcoming Events</a></li>
                <li><a href="#past-events">Past Events</a></li>
            </ul>
        </nav>
    </header>

    <main>
        
        <section id="upcoming-events">
            
            <h2>Upcoming Events</h2>

            <article>
                
                <h3>Your Next Event</h3>

                <p>This is THE event</p>
            
            </article>

            <article>
                
                <h3>Your Next Next Event</h3>

                <p>This is THE OTHER event</p>
            
            </article>
        </section>

        <section id="past-events">

            <h2>Past Events</h2>

            <article>
                
                <h3>Your Old Event</h3>
                
                <img src="https://cdn.freecodecamp.org/curriculum/labs/past-event1.jpg" alt="A picture of a very old event">

                <p>This was THE event</p>
            
            </article>

            <article>
                
                <h3>Your Older Event</h3>

                <img src="https://cdn.freecodecamp.org/curriculum/labs/past-event2.jpg" alt="A picture of cubes and connecting dots. Abstract">

                <p>This was THE OTHER event</p>
            
            </article>
        </section>

    </main>

</body>

</html>
