<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Player</title>
</head>

<body>

    <h1>Multimedia Player Lab</h1>

    <section>

        <h2>Sailing Away</h2>

        <audio controls aria-label="Audio player playing Sailing Away song">

            <source src="https://cdn.freecodecamp.org/js-music-player/sailing-away.mp3" type="audio/mpeg">

        </audio>

    </section>

    <section>

        <h2>What is the map Method and How Does It Work?</h2>

        <video controls width="600" aria-label="Video explaining the JavaScript map method">

            <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video/mp4">

            <track src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt" kind="subtitles" srclang="en" label="English">

        </video>

    </section>

    <section>

        <h2>Transcript</h2>

        <p>In this video, we explore the JavaScript map method, learning how it creates a new array populated with the results of calling a provided function on every element in the calling array.</p>

    </section>

</html>
