<body>
  <h1>Apple and Raisins Loaf</h1>

  <p>Follow along to bake your very own loaf!</p>

  <h2>Ingredients</h2>

  <ul>
    <li>Flour</li>
    <li>Sugar</li>
    <li>Eggs</li>
    <li>Milk</li>
    <li>Apples</li>
    <li>Raisins</li>
  </ul>

  <h2>Instructions</h2>
  
  <ol>
    <li>Weigh your flour</li>
    <li>Weigh your sugar</li>
    <li>Peel your apples</li>
    <li>Soak your raisins in warm water</li>
  </ol>
